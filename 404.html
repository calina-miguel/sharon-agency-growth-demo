<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting</title>
    <script>
      const cleanBase = "https://calina-miguel.github.io/sharon-agency-growth/";
      const cleanPath = window.location.pathname.replace(/^\/sharon-agency-growth-demo\/?/, "");
      window.location.replace(cleanBase + cleanPath + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to the current system.</p>
  </body>
</html>
